<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Expense Tracker</a>

    <div class="nav_elemets">
      <a class="nav-link d-inline text-white" href="#">Home</a>
      <a class="nav-link d-inline text-white" href="#expenses">Expenses</a>
      <a class="nav-link d-inline text-white" href="#addExpense">Add Expense</a>
    </div>
  </div>
</nav>
  <div id="alertContainer" class="container mt-3"></div>

  <div class="container mt-4">

    <div class="summary-grid">

      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Total Amount</h5>
          <p class="card-text" id="totalAmount">0 JD</p>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Number of Expenses</h5>
          <p class="card-text" id="expenseCount">0</p>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Highest Expense</h5>
          <p class="card-text" id="highestExpense">0 JD</p>
        </div>
      </div>

    </div>

  </div>

  <div class="container mt-4">

    <div class="card">
      <div class="card-body">

        <h5 class="card-title">Expenses by Category</h5>

        <div class="chart-container">
          <canvas id="expenseChart"></canvas>
        </div>

      </div>
    </div>

  </div>

  <div class="container mt-4" id="addExpense">

    <div class="card">
      <div class="card-body">

        <h5 class="card-title">Add Expense</h5>

        <form id="expenseForm">

          <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" id="title" class="form-control">
          </div>

          <div class="mb-3">
            <label for="amount" class="form-label">Amount</label>
            <input type="number" id="amount" class="form-control" step="0.01">
          </div>

          <div class="mb-3">
            <label for="category" class="form-label">Category</label>

            <select id="category" class="form-select">
              <option value="">Select category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>

          </div>

          <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" id="date" class="form-control">
          </div>

          <button type="submit" class="btn btn-primary">
            Add Expense
          </button>

        </form>

      </div>
    </div>

  </div>

  <div class="container mt-4">

    <label for="categoryFilter" class="form-label">
      Filter by category
    </label>

    <select id="categoryFilter" class="form-select">

      <option value="All">All</option>
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Bills">Bills</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Other">Other</option>

    </select>

  </div>

  <div class="container mt-4" id="expenses">

    <div id="loadingSpinner" class="text-center my-4 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div class="table-responsive">

      <table class="table table-sm">

        <thead>
          <tr>
            <th scope="col">Title</th>
            <th scope="col">Amount</th>
            <th scope="col">Category</th>
            <th scope="col">Date</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>

        <tbody id="expenseTableBody">
        </tbody>

      </table>

    </div>

  </div>

  <div class="modal fade" id="editModal" tabindex="-1">

    <div class="modal-dialog">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title">Edit Expense</h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
          ></button>

        </div>

        <div class="modal-body">

          <div id="editAlertContainer"></div>

          <form id="editForm">

            <div class="mb-3">
              <label for="editTitle" class="form-label">Title</label>
              <input type="text" id="editTitle" class="form-control">
            </div>

            <div class="mb-3">
              <label for="editAmount" class="form-label">Amount</label>
              <input
                type="number"
                id="editAmount"
                class="form-control"
                step="0.01"
              >
            </div>

            <div class="mb-3">

              <label for="editCategory" class="form-label">
                Category
              </label>

              <select id="editCategory" class="form-select">
                <option value="">Select category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>

            </div>

            <div class="mb-3">
              <label for="editDate" class="form-label">Date</label>
              <input type="date" id="editDate" class="form-control">
            </div>

          </form>

        </div>

        <div class="modal-footer">

          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>

          <button
            type="button"
            class="btn btn-primary"
            id="saveEditButton"
          >
            Save Changes
          </button>

        </div>

      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script type="module" src="js/app.js"></script>

</body>
</html>
